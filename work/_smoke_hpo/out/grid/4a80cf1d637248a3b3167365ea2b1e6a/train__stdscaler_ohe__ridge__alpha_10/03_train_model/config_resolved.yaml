  primary_metric: rmse
  direction: auto
  cv_folds: 0
  seed: 42
  ci:
    enabled: false
    n_boot: 200
    alpha: 0.05
    seed: 0
  thresholding:
    enabled: false
    metric: f1
    grid:
    - 0.05
    - 0.1
    - 0.15
    - 0.2
    - 0.25
    - 0.3
    - 0.35
    - 0.4
    - 0.45
    - 0.5
    - 0.55
    - 0.6
    - 0.65
    - 0.7
    - 0.75
    - 0.8
