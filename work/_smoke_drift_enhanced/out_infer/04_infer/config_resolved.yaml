run:
  usecase_id: TabularAnalysis
  output_dir: /Users/kawahito/Desktop/ml_polyrepo_workspace_v1/ml-solution-tabular-analysis/work/_smoke_drift_enhanced/out_infer
  schema_version: v1
  grid_run_id: null
  clearml:
    enabled: false
    execution: local
    project_root: MFG
    queue_name: null
    clone_from_task_id: null
    extra_tags: []
monitor:
  drift:
    enabled: true
    sample_n: 60
    metrics:
    - psi
    - ks
    alert_thresholds:
      psi: 0.05
data:
  dataset_path: null
  raw_dataset_id: null
  processed_dataset_id: null
  target_column: target
  id_columns: []
  drop_columns: []
  quality:
    enabled: true
    fail_on_duplicates: false
    fail_on_leak: true
    max_rows_scan: 50000
  split:
    strategy: random
    test_size: 0.2
    seed: 42
    group_column: null
    time_column: null
eval:
  task_type: regression
  primary_metric: rmse
  direction: auto
  cv_folds: 5
  seed: 42
  ci:
    enabled: false
    n_boot: 200
    alpha: 0.05
    seed: 0
  thresholding:
    enabled: false
    metric: f1
    grid:
    - 0.05
    - 0.1
    - 0.15
    - 0.2
    - 0.25
    - 0.3
    - 0.35
    - 0.4
    - 0.45
    - 0.5
    - 0.55
    - 0.6
    - 0.65
    - 0.7
    - 0.75
    - 0.8
    - 0.85
    - 0.9
    - 0.95
  calibration:
    enabled: false
    method: sigmoid
    mode: prefit
  uncertainty:
    enabled: false
    method: conformal_split
    alpha: 0.1
    use_abs_residual: true
  imbalance:
    enabled: false
    strategy: class_weight
    class_weight: balanced
  classification:
    mode: auto
    top_k: 1
  metrics:
    classification_multiclass:
    - accuracy
    - f1_macro
    - logloss
    classification_imbalance:
    - pr_auc
    - balanced_accuracy
    - fbeta
    fbeta_beta: 1.0
viz:
  enabled: true
  max_features: 20
  max_points: 1000
  confusion_normalize: true
  roc_curve: true
  heavy:
    enabled: false
group:
  preprocess:
    preprocess_variant:
      name: stdscaler_ohe
      numeric_scaler: standard
      categorical_encoder: onehot
      handle_unknown: ignore
  model:
    model_variant:
      name: ridge
      framework: sklearn
      class_path:
        regression: sklearn.linear_model.Ridge
        classification: sklearn.linear_model.RidgeClassifier
      params:
        alpha: 1.0
        random_state: ${eval.seed}
  split:
    split_variant:
      name: random
      strategy: random
  infer_mode:
    infer_mode:
      name: single
      input_format: json
task:
  name: infer
  stage: 04_infer
  project_name: ${run.clearml.project_root}/${run.usecase_id}/04_infer
infer:
  model_id: /Users/kawahito/Desktop/ml_polyrepo_workspace_v1/ml-solution-tabular-analysis/work/_smoke_drift_enhanced/out_train/03_train_model/model_bundle.joblib
  train_task_id: null
  mode: batch
  input_path: /Users/kawahito/Desktop/ml_polyrepo_workspace_v1/ml-solution-tabular-analysis/work/_smoke_drift_enhanced/tmp/infer.csv
  input_json: null
  validation:
    mode: warn
  drift:
    enabled: false
    psi_warn_threshold: 0.2
    psi_fail_threshold: 0.4
