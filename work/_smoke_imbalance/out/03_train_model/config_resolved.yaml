  schema_version: v1
  grid_run_id: null
  clearml:
    enabled: false
    execution: local
    project_root: MFG
    queue_name: null
    clone_from_task_id: null
    extra_tags: []
data:
  dataset_path: null
  raw_dataset_id: null
  processed_dataset_id: local:9a7e2ed7a7caf251c216596d7874cd600568a0bf36c7204192eb5958152b585c
  target_column: target
  id_columns: []
  drop_columns: []
  quality:
    enabled: true
    fail_on_duplicates: false
    fail_on_leak: true
    max_rows_scan: 50000
  split:
    strategy: random
    test_size: 0.2
    seed: 42
    group_column: null
