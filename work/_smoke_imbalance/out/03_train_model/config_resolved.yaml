eval:
  task_type: classification
  primary_metric: pr_auc
  direction: auto
  cv_folds: 0
  seed: 42
  thresholding:
    enabled: false
    metric: f1
    grid:
    - 0.05
    - 0.1
    - 0.15
    - 0.2
    - 0.25
    - 0.3
    - 0.35
    - 0.4
    - 0.45
    - 0.5
    - 0.55
    - 0.6
    - 0.65
    - 0.7
    - 0.75
    - 0.8
    - 0.85
    - 0.9
    - 0.95
  calibration:
    enabled: false
    method: sigmoid
  imbalance:
    enabled: true
    strategy: class_weight
    class_weight: balanced
  classification:
    mode: auto
    top_k: 1
  metrics:
    classification_multiclass:
    - accuracy
    - f1_macro
    - logloss
    classification_imbalance:
    - pr_auc
    - balanced_accuracy
    - fbeta
    fbeta_beta: 2.0
viz:
  enabled: true
  max_features: 20
  max_points: 1000
  confusion_normalize: true
  roc_curve: true
  heavy:
    enabled: false
group:
  preprocess:
    preprocess_variant:
      name: stdscaler_ohe
      numeric_scaler: standard
      categorical_encoder: onehot
      handle_unknown: ignore
  model:
    model_variant:
      name: logistic_regression
      framework: sklearn
      class_path: sklearn.linear_model.LogisticRegression
      params:
        max_iter: 1000
        random_state: ${eval.seed}
  split:
    split_variant:
      name: random
      strategy: random
  infer_mode:
    infer_mode:
      name: single
      input_format: json
task:
  name: train_model
  stage: 03_train_model
  project_name: ${run.clearml.project_root}/${run.usecase_id}/03_train_model
train:
  model: ${model_variant.name}
  params: {}
  inputs:
    preprocess_run_dir: null
model_variant:
  name: logistic_regression
  framework: sklearn
  class_path: sklearn.linear_model.LogisticRegression
  params:
    max_iter: 1000
    random_state: ${eval.seed}
