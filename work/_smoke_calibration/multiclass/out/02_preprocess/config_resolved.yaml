run:
  usecase_id: TabularAnalysis
  output_dir: /Users/kawahito/Desktop/ml_polyrepo_workspace_v1/ml-solution-tabular-analysis/work/_smoke_calibration/multiclass/out
  schema_version: v1
  grid_run_id: null
  clearml:
    enabled: false
    execution: local
    project_root: MFG
    queue_name: null
    clone_from_task_id: null
    extra_tags: []
data:
  dataset_path: /Users/kawahito/Desktop/ml_polyrepo_workspace_v1/ml-solution-tabular-analysis/work/_smoke_calibration/multiclass/tmp/toy_multiclass.csv
  raw_dataset_id: null
  processed_dataset_id: null
  target_column: target
  id_columns: []
  drop_columns: []
  quality:
    enabled: true
    fail_on_duplicates: false
    fail_on_leak: true
    max_rows_scan: 50000
  split:
    strategy: stratified
    test_size: 0.2
    seed: 42
    group_column: null
    time_column: null
eval:
  task_type: classification
  primary_metric: rmse
  direction: auto
  cv_folds: 5
  seed: 42
  thresholding:
    enabled: false
    metric: f1
    grid:
    - 0.05
    - 0.1
    - 0.15
    - 0.2
    - 0.25
    - 0.3
    - 0.35
    - 0.4
    - 0.45
    - 0.5
    - 0.55
    - 0.6
    - 0.65
    - 0.7
    - 0.75
    - 0.8
    - 0.85
    - 0.9
    - 0.95
  calibration:
    enabled: false
    method: sigmoid
    mode: prefit
  uncertainty:
    enabled: false
    method: conformal_split
    alpha: 0.1
    use_abs_residual: true
  imbalance:
    enabled: false
    strategy: class_weight
    class_weight: balanced
  classification:
    mode: auto
    top_k: 1
  metrics:
    classification_multiclass:
    - accuracy
    - f1_macro
    - logloss
    classification_imbalance:
    - pr_auc
    - balanced_accuracy
    - fbeta
    fbeta_beta: 1.0
viz:
  enabled: true
  max_features: 20
  max_points: 1000
  confusion_normalize: true
  roc_curve: true
  heavy:
    enabled: false
group:
  preprocess:
    preprocess_variant:
      name: stdscaler_ohe
      numeric_scaler: standard
      categorical_encoder: onehot
      handle_unknown: ignore
  model:
    model_variant:
      name: ridge
      framework: sklearn
      class_path:
        regression: sklearn.linear_model.Ridge
        classification: sklearn.linear_model.RidgeClassifier
      params:
        alpha: 1.0
        random_state: ${eval.seed}
  split:
    split_variant:
      name: stratified
      strategy: stratified
  infer_mode:
    infer_mode:
      name: single
      input_format: json
task:
  name: preprocess
  stage: 02_preprocess
  project_name: ${run.clearml.project_root}/${run.usecase_id}/02_preprocess
preprocess:
  variant: ${preprocess_variant.name}
  numeric_impute: mean
  categorical_impute: most_frequent
  categorical:
    encoding: onehot
    auto_onehot_max_categories: 50
    hashing:
      n_features: 128
    target_mean_oof:
      folds: 5
      smoothing: 10.0
preprocess_variant:
  name: stdscaler_ohe
  numeric_scaler: standard
  categorical_encoder: onehot
  handle_unknown: ignore
