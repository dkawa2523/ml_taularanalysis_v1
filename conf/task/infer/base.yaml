# @package _global_
task:
  name: infer
  stage: "04_infer"
  project_name: "${run.clearml.project_root}/TabularAnalysis/${run.usecase_id}/04_infer"

infer:
  # 推論に使う model の指定方法：
  # - model_id（ClearML Model ID）
  # - train_task_id（train task から model を辿る）
  model_id: null
  train_task_id: null

  # 推論モード（conf/group/infer_mode/*.yaml で定義）
  mode: single
  input_path: null
  input_json: null

  validation:
    # warn|strict|coerce
    mode: warn

  batch:
    # Chunked batch infer settings
    chunk_size: 50000
    output_format: csv
    write_mode: overwrite
    max_rows: null

  drift:
    enabled: false
    psi_warn_threshold: 0.2
    psi_fail_threshold: 0.4
