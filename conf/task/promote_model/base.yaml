# @package _global_
task:
  name: promote_model
  stage: "06_promote_model"
  project_name: "${run.clearml.project_root}/TabularAnalysis/${run.usecase_id}/06_promote_model"

promotion:
  # Either leaderboard output dir (local) or leaderboard task id (ClearML)
  source_leaderboard_dir: null

  # Direct model id/path override (optional)
  recommended_model_id: null

  # Promotion stage
  stage: production

  # Update champion registry
  set_champion: true

  # Roll back to previous champion
  rollback: false

  # Optional note for traceability
  note: null

# Alias for CLI (preferred in new flows)
promote:
  source_leaderboard_dir: ${promotion.source_leaderboard_dir}
  recommended_model_id: ${promotion.recommended_model_id}
  stage: ${promotion.stage}
  set_champion: ${promotion.set_champion}
  rollback: ${promotion.rollback}
  note: ${promotion.note}
