# ClearML 上で識別するための UseCase ID（Project 階層・Properties にも利用）
# null の場合は run.usecase_id_policy に従って自動生成する
# policy selectors: ops/usecase_id_policy and ops/clearml_policy
usecase_id: null

# 全タスク共通の出力先（ローカル実行時）
output_dir: outputs/${now:%Y%m%d_%H%M%S}

# schema_version は artifacts/manifest の互換性キー（Solution 側で固定）
schema_version: v1

# grid 実行単位の識別子（pipeline が設定して各タスクへ伝播させる）
grid_run_id: null

# retrain 単位の識別子（retrain が設定して各タスクへ伝播させる）
retrain_run_id: null

clearml:
  # enabled=false の時は ClearML SDK を使わずローカルで処理する（開発・デバッグ用）
  enabled: false

  # 実行モード：local | logging | agent | clone | pipeline_controller | pipeline_controller_local
  # local: ClearMLなし（pipeline は enabled=true の場合 child tasks を logging で記録）
  # logging: ローカル実行しつつ ClearML に記録
  # agent: Task.execute_remotely で投入
  # clone: テンプレTaskから clone して投入
  # pipeline_controller: PipelineController を agent で実行して子タスク生成
  # pipeline_controller_local: controller はローカル、子タスクは queue に投入
  execution: local

  # ClearML Task Script の code reference
  # mode: branch | commit | none
  # - branch: repository/branch を設定し version_num を空にする（既定）
  # - commit: repository/branch + commit pin（厳密再現用）
  # - none: repository/branch/version_num を設定しない（Local用途のみ）
  # "auto" は conf/ を含むリポジトリルートから git を検出する
  code_ref:
    mode: "branch"
    repository: "auto"
    branch: "auto"
    commit: "auto"

  # legacy alias (backward compatibility)
  code_repository: "auto"
  code_branch: "auto"
  # branch_head | pin_commit (legacy; prefer run.clearml.code_ref.mode)
  code_version_mode: "branch_head"

  # project のルート（例: MFG/<UseCase>/<Stage>）
  project_root: "MFG"
  project_name: null

  # テンプレートタスクを置く usecase_id（templates.yaml の {usecase_id} に対応）
  template_usecase_id: "TabularAnalysis"

  # テンプレート運用の世代識別子（templates.yaml の {template_set_id} に対応）
  template_set_id: "ta_v1"

  # tags/properties のポリシーは run.clearml.policy で切り替える

  # agent 実行時の queue
  queue_name: null

  # clone 実行時のテンプレ task_id（任意。運用で固定）
  clone_from_task_id: null

  # 追加タグ（usecase/process/schema/grid は標準で付与する想定）
  extra_tags: []

  # pipeline が子タスクの親を紐づける際に使用（Hydra override 用）
  parent_task_id: null

  # ClearML UI reporting toggles
  reporting:
    enable_scalars: true
    enable_plots: true
    enable_tables: true
# Monitoring defaults are defined in conf/monitor/base.yaml.
