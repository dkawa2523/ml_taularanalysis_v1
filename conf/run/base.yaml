# ClearML 上で識別するための UseCase ID（Project 階層・Properties にも利用）
# null の場合は run.usecase_id_policy に従って自動生成する
# policy selectors: ops/usecase_id_policy and ops/clearml_policy
usecase_id: null

# 全タスク共通の出力先（ローカル実行時）
output_dir: outputs/${now:%Y%m%d_%H%M%S}

# schema_version は artifacts/manifest の互換性キー（Solution 側で固定）
schema_version: v1

# grid 実行単位の識別子（pipeline が設定して各タスクへ伝播させる）
grid_run_id: null

# retrain 単位の識別子（retrain が設定して各タスクへ伝播させる）
retrain_run_id: null

clearml:
  # enabled=false の時は ClearML SDK を使わずローカルで処理する（開発・デバッグ用）
  enabled: false

  # 実行モード：local | logging | agent | clone | pipeline_controller | pipeline_controller_local
  # local: ClearMLなし
  # logging: ローカル実行しつつ ClearML に記録
  # agent: Task.execute_remotely で投入
  # clone: テンプレTaskから clone して投入
  # pipeline_controller: PipelineController を agent で実行して子タスク生成
  # pipeline_controller_local: controller はローカル、子タスクは queue に投入
  execution: local

  # ClearML Task Script の repository/branch を指定する
  # "auto" は conf/ を含むリポジトリルートから git を検出する
  code_ref:
    # branch | commit | none
    mode: "branch"
    # "auto" は conf/ を含むリポジトリルートから git を検出する
    repository: "auto"
    branch: "auto"
    # mode=commit の時に使う（"auto" は git HEAD を使う）
    commit: "auto"

  # legacy keys (backward compatible)
  code_repository: ${run.clearml.code_ref.repository}
  code_branch: ${run.clearml.code_ref.branch}

  # ClearML Task Script の version_num ポリシー
  # branch_head | pin_commit | none (legacy). use code_ref.mode instead.
  code_version_mode: ${run.clearml.code_ref.mode}

  # project のルート（例: MFG/<UseCase>/<Stage>）
  project_root: "MFG"

  # テンプレートタスクを置く usecase_id（templates.yaml の {usecase_id} に対応）
  template_usecase_id: "TabularAnalysis"

  # tags/properties のポリシーは run.clearml.policy で切り替える

  # agent 実行時の queue
  queue_name: null

  # clone 実行時のテンプレ task_id（任意。運用で固定）
  clone_from_task_id: null
  # pipeline タスク ID（子タスクへ伝播して registry tag に利用）
  pipeline_task_id: null
  # task_name override (used by optimize child tasks)
  task_name: null

  # PipelineController を hidden project にせず可視 project に置くための設定
  # project_mode: subproject | visible
  pipeline:
    project_mode: "subproject"
    # Optional override for pipeline controller project (full path)
    # null の場合は run.clearml.project_name（usecase配下）に配置する
    project_name: null
    # Ensure pipeline projects show in Pipelines tab by tagging the project as pipeline.
    project_tag_pipeline: true
    # Remove hidden tag when present so UI does not require "Show hidden projects".
    project_unhide: true

  # 追加タグ（usecase/process/schema/grid は標準で付与する想定）
  extra_tags: []

  # ClearML UI 出力のON/OFF
  reporting:
    enable_scalars: true
    enable_plots: true
    enable_tables: true
  # Environment bootstrap (ClearML Agent side should stay minimal).
  env:
    # none | uv | auto (auto uses uv only when CLEARML_TASK_ID is present)
    bootstrap: "none"
    # System packages to install at task runtime (apt-get based images only).
    # This is handled inside tools/clearml_entrypoint.py, not agent config.
    apt_packages: []
    apt_update: true
    apt_allow_local: false
    uv:
      venv_dir: ".venv"
      extras: []
      all_extras: true
      frozen: true
# Monitoring defaults are defined in conf/monitor/base.yaml.
